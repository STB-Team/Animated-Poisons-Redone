[Settings]
; Animation speed: 1.0 = original, 1.5 = one and a half times faster (0.5 ... 3.0)
fAnimSpeed = 1.0
; A poison applied in this last share of the animation plays it once more right after it (0.4 = last 40 %). 0 = off
fRepeatWindow = 0.4
; Sheathed weapon: draw it and apply the poison (it stays drawn). false = no animation while sheathed
bDrawSheathed = true
; Crossbow: false = the bottle animation on the crossbow itself (like a sword). true = poison the bolt
; in the hand instead, like the bow's arrow -- off by default: the bolt model keeps its flight trail,
; which looks odd in the hand
bCrossbow = false
; With Skyrim Souls (unpaused menus): play the animation while the inventory is open. false = after it closes
bPlayInMenus = true
; Detailed log for testing (Documents/My Games/Skyrim Special Edition/SKSE/AnimatedPoisonsRedone.log)
bDebugLog = false
